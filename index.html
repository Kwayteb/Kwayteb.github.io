<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free Borneo</title>

  <style>
    /* =========================
       RESET
       ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       BODY
       ========================= */

    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;
    }

    body {
      background: #211c19;
      color: #e8ddd3;

      font-family: Georgia, serif;
    }


    /* =========================
       COVER
       ========================= */

    .cover {
      width: 100%;
      height: 100vh;
      height: 100svh;

      min-height: 320px;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, 6vw)
        max(20px, env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      position: relative;

      overflow: hidden;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
      font-size: clamp(0.65rem, 1.2vw, 0.9rem);

      letter-spacing: clamp(2px, 0.5vw, 5px);

      text-transform: uppercase;

      color: #bda58f;

      margin-bottom: clamp(18px, 5vh, 55px);
    }


    /* =========================
       TITLE
       ========================= */

    h1 {
      font-size: clamp(2.2rem, 7vw, 6rem);

      line-height: 1.05;

      font-weight: normal;

      letter-spacing: clamp(-1.5px, -0.15vw, -3px);

      max-width: 1000px;

      margin-bottom: clamp(14px, 3vh, 28px);
    }


    /* =========================
       DESCRIPTION
       ========================= */

    .description {
      width: min(90%, 620px);

      font-size: clamp(0.9rem, 1.5vw, 1.2rem);

      line-height: 1.7;

      color: #bfb2a8;

      margin-bottom: clamp(20px, 4vh, 45px);
    }


    /* =========================
       BUTTON
       ========================= */

    .button {
      display: inline-block;

      padding:
        clamp(10px, 1.5vw, 16px)
        clamp(20px, 3vw, 35px);

      border: 1px solid #8e7765;

      color: #e8ddd3;

      text-decoration: none;

      font-size: clamp(0.8rem, 1.2vw, 1rem);

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }


    .button:hover {
      background: #e8ddd3;

      color: #211c19;

      transform: translateY(-3px);
    }


    /* =========================
       FOOTER
       ========================= */

    footer {
      position: absolute;

      bottom: max(15px, env(safe-area-inset-bottom));

      left: 0;

      width: 100%;

      text-align: center;

      font-size: clamp(0.6rem, 1vw, 0.75rem);

      color: #766960;

      letter-spacing: 1px;
    }


    /* =========================
       HP LANDSCAPE
       ========================= */

    @media (orientation: landscape) and (max-height: 600px) {

      .cover {
        padding:
          15px
          8vw
          30px;
      }

      .logo {
        margin-bottom: 10px;
      }

      h1 {
        font-size: clamp(2rem, 8vw, 4rem);

        margin-bottom: 8px;
      }

      .description {
        width: min(80%, 650px);

        font-size: clamp(0.75rem, 2vw, 1rem);

        line-height: 1.4;

        margin-bottom: 12px;
      }

      .button {
        padding: 8px 20px;
      }

      footer {
        bottom: 8px;
      }
    }


    /* =========================
       TABLET
       ========================= */

    @media (min-width: 600px) {

      .cover {
        padding-left: 8vw;
        padding-right: 8vw;
      }
    }


    /* =========================
       DESKTOP
       ========================= */

    @media (min-width: 1000px) {

      .cover {
        padding-left: 10vw;
        padding-right: 10vw;
      }

      h1 {
        font-size: clamp(4rem, 6vw, 6rem);
      }

      .description {
        font-size: 1.15rem;
      }

      .button {
        font-size: 1rem;
      }
    }


    /* =========================
       ANIMASI MASUK
       ========================= */

    .logo,
    h1,
    .description,
    .button {
      animation: muncul 0.8s ease both;
    }

    h1 {
      animation-delay: 0.1s;
    }

    .description {
      animation-delay: 0.2s;
    }

    .button {
      animation-delay: 0.3s;
    }

    @keyframes muncul {

      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

  </style>
</head>


<body>

  <main class="cover">

    <div class="logo">
      Free Borneo
    </div>


    <h1>
      Catatan & Tulisan
    </h1>


    <p class="description">
      Sebuah ruang untuk menyimpan pemikiran,
      tulisan, catatan, dan berbagai artikel.
    </p>


    <a href="/articles/:radd/" class="button">
      Baca Artikel
    </a>


    <footer>
      © 2026
    </footer>

  </main>

</body>

</html>
