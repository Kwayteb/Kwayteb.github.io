<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free Borneo</title>

  <style>

    /* =========================
       RESET
       ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       BODY
       ========================= */

    body {
      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #211c19;
      color: #e8ddd3;

      font-family: Georgia, serif;
    }


    /* =========================
       COVER
       ========================= */

    .cover {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 30px;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;

      margin-bottom: 50px;

      color: #bda58f;
    }


    /* =========================
       TITLE
       ========================= */

    h1 {
      font-size: clamp(42px, 8vw, 90px);

      font-weight: normal;

      letter-spacing: -2px;

      margin-bottom: 20px;
    }


    /* =========================
       DESCRIPTION
       ========================= */

    .description {
      max-width: 550px;

      font-size: 17px;

      line-height: 1.8;

      color: #bfb2a8;

      margin-bottom: 45px;
    }


    /* =========================
       BUTTON
       ========================= */

    .button {
      display: inline-block;

      padding: 13px 28px;

      border: 1px solid #8e7765;

      color: #e8ddd3;

      text-decoration: none;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }


    .button:hover {
      background: #e8ddd3;
      color: #211c19;

      transform: translateY(-3px);
    }


    /* =========================
       FOOTER
       ========================= */

    footer {
      position: absolute;

      bottom: 25px;

      font-size: 12px;

      color: #766960;

      letter-spacing: 1px;
    }

  </style>
</head>


<body>

  <main class="cover">

    <div class="logo">
      Free Borneo
    </div>


    <h1>
      Catatan & Tulisan
    </h1>


    <p class="description">
      Sebuah ruang untuk menyimpan pemikiran,
      tulisan, catatan, dan berbagai artikel.
    </p>


    <a href="/blog/" class="button">
      Baca Artikel
    </a>


    <footer>
      © 2026
    </footer>

  </main>


</body>

</html>
